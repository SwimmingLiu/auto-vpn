name: Deploy Cloudflare

# Builds the container image, pushes it, and rolls the Worker.
#
# Pull requests run `cloudflare-tests.yml`; this workflow repeats those suites
# as a gate before anything on main can deploy. A push to main deploys only
# when `CLOUDFLARE_CONTAINERS_ENABLED` is `true`: without the Workers Paid plan
# the permission probe fails before anything is uploaded, which used to leave
# every cloudflare/** merge with a red run. `workflow_dispatch` always runs, so
# the probe can still report plan status.
#
# The deploy needs a Cloudflare API token with **Containers → Edit**. That scope
# is not in the stock Workers template, and `wrangler deploy` only says
# "Authentication error" when it is absent — so `deploy.sh` probes every
# permission first and fails in seconds instead of after a ten-minute build.
#
# Runs on a native linux/amd64 runner: the image is linux/amd64, so CI builds
# it without the emulation a local Apple silicon Docker would need.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cloudflare/**'
      # The container test suite pins both of these; a version bump or template
      # edit on main must still rebuild the image that carries them.
      - 'npm/autovpn-cli/package.json'
      - 'templates/vmess_node.js'
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

# Two deploys must never interleave: `wrangler deploy` replaces the Worker and
# the container application as a unit, so a slower earlier run finishing last
# would leave the account on stale code.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

env:
  NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  # The same two suites `cloudflare-tests.yml` runs on pull requests. Repeated
  # here because a main push can skip the pull request (direct commits, merges
  # of stale branches) and a failing test must not reach `wrangler deploy`.
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Egress supervisor tests
        working-directory: cloudflare/container
        run: node --test test/*.test.mjs

      - name: Pipeline controller tests
        working-directory: cloudflare/worker
        run: node --test test/*.test.mjs

  deploy:
    name: Deploy Worker and Container
    needs: test
    # A plan without Containers cannot deploy; this variable is the switch for
    # automatic deploys after the plan is upgraded.
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_CONTAINERS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Attach required reviewers to this environment in repository settings to
    # turn every deploy into an approval. Without that it simply runs.
    environment: cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/worker/package-lock.json

      # `deploy.sh` treats an absent AUTOVPN_API_TOKEN as "generate a new one",
      # which is right on a workstation and wrong here: it would rotate the
      # bearer token on every deploy and lock out every existing client. Fail
      # before the build instead.
      - name: Check required configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.AUTOVPN_API_TOKEN }}
          SUB_URL: ${{ secrets.AUTOVPN_SUBSCRIPTION_URL }}
        run: |
          missing=0
          check() { if [ -z "$2" ]; then echo "missing $1" >&2; missing=1; fi; }
          check "secret CLOUDFLARE_API_TOKEN" "$CF_TOKEN"
          check "variable CLOUDFLARE_ACCOUNT_ID" "$CF_ACCOUNT"
          check "secret AUTOVPN_API_TOKEN" "$API_TOKEN"
          if [ -z "$SUB_URL" ]; then
            echo "warning: secret AUTOVPN_SUBSCRIPTION_URL is unset; the crawl will start with no egress pool and go out direct" >&2
          fi
          exit "$missing"

      - name: Install wrangler
        run: npm ci --prefix cloudflare/worker

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AUTOVPN_API_TOKEN: ${{ secrets.AUTOVPN_API_TOKEN }}
          AUTOVPN_SUBSCRIPTION_URL: ${{ secrets.AUTOVPN_SUBSCRIPTION_URL }}
          AUTOVPN_BASE_URL: ${{ vars.AUTOVPN_BASE_URL }}
          # The profile targets the live subscription project, so this must be
          # set or `deploy.sh` refuses. Point `project_name` at a scratch
          # project for a run that should not touch it.
          AUTOVPN_ALLOW_LIVE_PROJECT: ${{ vars.AUTOVPN_ALLOW_LIVE_PROJECT }}
        run: cloudflare/scripts/deploy.sh
