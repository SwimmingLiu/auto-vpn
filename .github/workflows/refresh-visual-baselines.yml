name: Refresh Linux visual baselines

# Linux pixel baselines and the renderer digests must be produced by the same
# ubuntu-24.04 runner that checks them. An amd64 container on Apple silicon
# rasterizes differently (untouched pages moved up to 14.6% in measurement), so
# the correct source is the CI image itself.
#
# Trigger it by adding the `refresh-visual-baselines` label to a pull request in
# this repository. The job regenerates the Linux PNGs and the `linux` digest
# block, commits them to the PR's own branch, and pushes. It runs only for
# branches in this repository, never for a fork.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to refresh (an in-repo branch)
        required: true

permissions:
  contents: write

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_PREFER_OFFLINE: "true"

jobs:
  refresh:
    if: |
      github.event_name == 'workflow_dispatch'
      || (github.event.label.name == 'refresh-visual-baselines' && github.event.pull_request.head.repo.full_name == github.repository)
    name: Refresh ubuntu-24.04 baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout the pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            npm/autovpn-cli/package-lock.json

      - name: Install Node dependencies
        run: bash scripts/ci/retry-command.sh "npm ci" -- npm ci --prefer-offline --no-audit --fund=false

      - name: Install npm CLI dependencies
        run: |
          bash scripts/ci/retry-command.sh "npm ci --prefix npm/autovpn-cli" -- \
            npm ci --prefix npm/autovpn-cli --prefer-offline --no-audit --fund=false

      - name: Install pinned Playwright Chromium runtime
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Build the CLI
        run: npm run build:autovpn-cli

      - name: Rewrite the H5 pixel baselines
        run: UPDATE_VISUAL_BASELINES=1 node --test --test-concurrency=1 electron/tests/web-server-visual.test.mjs

      - name: Re-run the H5 gate against the new baselines
        run: node --test --test-concurrency=1 electron/tests/web-server-visual.test.mjs

      - name: Capture this runner's renderer digests
        run: |
          set -o pipefail
          UPDATE_RENDERER_DIGESTS=1 node --test electron/tests/renderer-visual.test.mjs | tee renderer-digests.txt
          node scripts/ci/refresh-visual-digests.mjs "$(grep -o 'RENDERER_DIGESTS .*' renderer-digests.txt | head -1 | sed 's/^RENDERER_DIGESTS //')"

      - name: Re-run the renderer visual gate against the new digests
        run: node --test electron/tests/renderer-visual.test.mjs

      - name: Commit the refreshed baselines to the branch
        run: |
          rm -f renderer-digests.txt
          if git diff --quiet -- electron/tests/visual-baselines/h5/linux electron/tests/renderer-visual.test.mjs; then
            echo "baselines already current for this runner; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/tests/visual-baselines/h5/linux electron/tests/renderer-visual.test.mjs
          git commit -m "test: refresh the ubuntu-24.04 visual baselines"
          git push
