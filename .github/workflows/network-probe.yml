name: Network probe

# Temporary: characterise the runner's network before committing to it as the
# crawl host. Deleted once the numbers are recorded.

on:
  push:
    branches: [feat/cloudflare-deployment]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Where is this runner
        run: |
          curl -sS -m 15 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|loc|colo)='
          echo "--- cpu/mem ---"
          nproc; free -g | head -2

      - name: Uplink, three endpoints, 10 MB each
        run: |
          for url in \
            'https://speed.cloudflare.com/__down?bytes=10000000' \
            'https://raw.githubusercontent.com/bulianglin/demo/main/10MB.bin' \
            'https://proof.ovh.net/files/10Mb.dat'
          do
            printf '%-70s ' "$(echo "$url" | cut -c1-66)"
            curl -sS -m 40 -o /dev/null -w '%{speed_download}\n' "$url" 2>/dev/null \
              | awk '{printf "%.2f MB/s\n", $1/1024/1024}'
          done

      - name: Ten concurrent downloads
        run: |
          start=$(date +%s)
          for i in $(seq 1 10); do
            curl -sS -m 40 -o /dev/null -w "%{speed_download}\n" \
              'https://speed.cloudflare.com/__down?bytes=10000000' &
          done
          wait > /tmp/speeds.txt 2>&1
          end=$(date +%s)
          echo "10 x 10MB concurrent in $((end-start))s"

      - name: Can it run a proxy binary and bind a port
        run: |
          curl -sSL -o /tmp/mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-linux-amd64-v1.19.34.gz
          gunzip -f /tmp/mihomo.gz && chmod +x /tmp/mihomo
          /tmp/mihomo -v
          printf 'mixed-port: 7897\nmode: direct\nlog-level: silent\n' > /tmp/m.yaml
          /tmp/mihomo -f /tmp/m.yaml -d /tmp &
          sleep 3
          curl -sS -m 10 -o /dev/null -w 'through local mihomo: %{http_code}\n' \
            -x http://127.0.0.1:7897 https://www.gstatic.com/generate_204
          curl -sS -m 10 -o /dev/null -w '10MB through local mihomo: %{speed_download}\n' \
            -x http://127.0.0.1:7897 'https://speed.cloudflare.com/__down?bytes=10000000'
