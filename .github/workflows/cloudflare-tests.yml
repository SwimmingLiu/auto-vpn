name: Cloudflare Worker tests

# Unit tests for the Cloudflare-native path: the container egress supervisor
# and the Worker/Durable Object pipeline controller. Deployment lives in
# `deploy-cloudflare.yml`; it is not part of this workflow, so a pull request
# never depends on Cloudflare credentials.
#
# These suites need neither the platform nor wrangler: the worker tests load
# `src/index.js` through a shim and run the Durable Object logic against a real
# in-memory sqlite.

on:
  pull_request:
    paths:
      - 'cloudflare/**'
      # The container tests read both of these.
      - 'npm/autovpn-cli/package.json'
      - 'templates/vmess_node.js'
      - '.github/workflows/cloudflare-tests.yml'
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Egress supervisor tests
        working-directory: cloudflare/container
        run: node --test test/*.test.mjs

      - name: Pipeline controller tests
        working-directory: cloudflare/worker
        run: node --test test/*.test.mjs
