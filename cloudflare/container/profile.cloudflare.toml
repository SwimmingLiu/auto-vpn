# Cloudflare deployment profile for AutoVPN.
#
# This is the profile the *container* reads. It differs from the VPS profile in
# exactly two ways, both deliberate:
#
#   1. `project_name` is a project that actually exists. The VPS profile points
#      at `sub-links-auto`, which returns 8000007 (project not found); the live
#      subscription is served by `sub-nodes-04`.
#   2. `min_final_links` agrees with the gate the Durable Object enforces. The
#      VPS had 50 in `daily-run.sh` and 10 here, and `assertDeployMinimumFinalLinks`
#      throws at 10 — three thresholds, two of them dead.
#
# Credentials are NOT here. `cloudflare_api_token`, the vendor `device_token`s
# and the account passwords arrive as Worker secrets and are written to the
# mounted volume at boot by `installProfile()`.
#
# Sources in `credential` mode: each needs only a location, and leases its
# account from the pool at extract time. This is why the profile carries no
# `url`/`key` — a hardcoded evmess URL would bypass the pool and go stale the
# moment the vendor rotates a domain, which they do weekly.
#
# `max_runtime_seconds` is the per-brand crawl budget. The VPS default is 900 s
# and `max_runtime_seconds = 0` in the interactive profile means unbounded — on
# Cloudflare an unbounded sweep is a metered, six-hour-capped run, so the
# scheduled deployment pins a finite budget here.

[sources.leiting]
mode = "credential"
official_site = "https://www.68123836.com"
enabled = true
platforms = ["android", "ios"]
max_iterations = 10000
min_iterations = 10000
plateau_limit = 20
use_random_area = true
area_min = 0
area_max = 100
failure_limit = 3
max_runtime_seconds = 900

