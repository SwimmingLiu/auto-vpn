# Cloudflare deployment profile for AutoVPN. Rationale: cloudflare/README.md.
#
# Deliberate differences from the VPS profile:
#   1. `project_name` is this deployment's own project, never the VPS's.
#   2. `min_final_links` agrees with the Durable Object gate.
#   3. `min_iterations` is 24, not 10000: the budget and plateau are only
#      consulted at or past it, so a 10,000 floor makes both decorative.
#   4. Credentials arrive as Worker secrets, never in this file.
#
# `credential` sources need only a location and lease an account from the pool
# at extract time, so no `url`/`key` appears: a hardcoded evmess URL would
# bypass the pool and go stale when the vendor rotates a domain, weekly.

[sources.leiting]
mode = "credential"
official_site = "https://www.68123836.com"
enabled = true
platforms = ["android", "ios"]
max_iterations = 1000
min_iterations = 24
plateau_limit = 50
use_random_area = true
area_min = 0
area_max = 100
failure_limit = 3
max_runtime_seconds = 900

