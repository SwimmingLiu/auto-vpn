# Cloudflare deployment profile for AutoVPN. Rationale: cloudflare/README.md.
#
# This is the profile the *container* reads. Four deliberate differences from
# the VPS profile:
#
#   1. `project_name` is a scratch project. The deploy stage replaces the whole
#      production deployment of whatever project it names, so the first runs
#      must not touch the subscription already in service.
#   2. `min_final_links` agrees with the Durable Object gate (the VPS carried
#      three thresholds, two of them dead).
#   3. `min_iterations` is 24, not 10000. `max_runtime_seconds` and
#      `plateau_limit` are only consulted at or past `min_iterations`, so a
#      floor of 10,000 makes both decorative — the loop is floor-gated to
#      10,000 rounds. 24 = one sweep of the default area list at 8/round.
#   4. Writes only to the scratch project; credentials arrive as Worker secrets
#      and are written to the volume at boot by `installProfile()`.
#
# Sources in `credential` mode need only a location and lease their account
# from the pool at extract time, so no `url`/`key` appears here: a hardcoded
# evmess URL would bypass the pool and go stale when the vendor rotates a
# domain, which they do weekly.

[sources.leiting]
mode = "credential"
official_site = "https://www.68123836.com"
enabled = true
platforms = ["android", "ios"]
max_iterations = 10000
min_iterations = 24
plateau_limit = 20
use_random_area = true
area_min = 0
area_max = 100
failure_limit = 3
max_runtime_seconds = 900

